name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEKLIFKIT_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REQUIRE_DB: "1" # Postgres'e ulaşılamazsa testler atlanmaz, kırmızı olur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: PDF için sistem kütüphaneleri (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t teklifkit .
      - name: Konteyner açılıyor mu, PDF üretebiliyor mu?
        run: |
          docker run -d --name tk -p 10000:10000 \
            -e DATABASE_URL=postgresql://unused@localhost/unused \
            -e JWT_SECRET=ci-icin-en-az-32-karakterlik-secret-degeri teklifkit
          for i in $(seq 1 30); do curl -fs localhost:10000/healthz && break; sleep 1; done
          curl -fs localhost:10000/login > /dev/null
          docker exec tk python -c "from app.pdf import render_pdf; assert render_pdf('<p>ÇŞĞİ ₺</p>').startswith(b'%PDF')"
